<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Percentil ATP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecera">
  <svg class="icono-tenis" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="19" fill="#86efac" stroke="#15803d" stroke-width="2.5"/>
    <path d="M24 5 C 13 13, 13 35, 24 43" fill="none" stroke="#f0fdf4" stroke-width="2"/>
    <path d="M24 5 C 35 13, 35 35, 24 43" fill="none" stroke="#f0fdf4" stroke-width="2"/>
  </svg>
  <div>
    <h1>Percentil ATP (2025)</h1>
    <p class="subtitulo">Compara a un jugador con el resto del circuito ATP: saque, ranking, altura y más.</p>
  </div>
</header>

<section id="controles">
  <label>
    Estadística:
    <select id="select-stat"></select>
  </label>

  <label>
    Algoritmo:
    <select id="select-algoritmo">
      <option value="naive">Pivote ingenuo</option>
      <option value="mom">Mediana de medianas</option>
    </select>
  </label>

  <div class="presets">
    <button data-percentil="90">Top 10%</button>
    <button data-percentil="75">Top 25%</button>
    <button data-percentil="50">Mediana</button>
  </div>

  <label>
    Percentil: <span id="valor-percentil">50</span>
    <input type="range" id="slider-percentil" min="1" max="99" value="50">
  </label>
  <p class="pista" id="pista-percentil"></p>

  <button id="boton-calcular">Calcular corte</button>
</section>

<section id="resultado-percentil"></section>

<section id="ubicar">
  <h2>¿En qué percentil quedo yo?</h2>
  <label>
    Mi valor:
    <input type="number" id="input-valor-propio" step="0.1">
  </label>
  <button id="boton-ubicar">Ubicarme</button>
  <div id="resultado-ubicar"></div>
</section>

<section id="visualizador">
  <h2>¿Quién está dentro del percentil?</h2>
  <div id="resumen-percentil"></div>
  <div id="leyenda" class="leyenda" hidden>
    <span class="leyenda-item dentro"><span class="punto"></span>Dentro del percentil</span>
    <span class="leyenda-item fuera"><span class="punto"></span>Fuera del percentil</span>
  </div>
  <div id="tarjetas"></div>
</section>

<script src="app.js"></script>
</body>
</html>
